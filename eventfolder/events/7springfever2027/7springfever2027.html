<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Springfever 2027</title>

    <link rel="stylesheet" href="../0allgemein/new_event_design.css">
</head>

<body>

<!-- NAVIGATION -->
<nav>
  <div class="nav-container">
    <div class="logo">
      <img src="../../../indexfolder/startseitenfotos/nav-logo.PNG" alt="L4D2 LAN">
    </div>
  <ul class="nav-links">
    <li><a href="../../../index.html">Startseite</a></li>
    <li><a href="../../../events.html" class="active">Events</a></li>
    <li><a href="../../../spieler.html">Spieler</a></li>
  </ul>
  </div>
</nav>

<!-- ==========================
     HERO
=========================== -->
<header
class="hero"
style="
background-image:
linear-gradient(
rgba(0,0,0,.55),
rgba(0,0,0,.80)
),
url('Springfever2027_cover.png');
">

<div class="hero-content">

    <h1>SPRINGFEVER 2027</h1>

<!-- SCOREBOARD -->

<div class="scoreboard">

    <div class="score-team">

        <img
        class="team-logo"
        src=""
        alt="">

        <div>

            <div class="score-team-name">
                Team A
            </div>

            <div
                class="score-team-points blue"
                id="eaglesTotal">
                0
            </div>

        </div>

    </div>

    <div class="versus">
        VS
    </div>

    <div class="score-team">

        <div>

            <div class="score-team-name">
                Team B
            </div>

            <div
                class="score-team-points red"
                id="chicksTotal">
                0
            </div>

        </div>

        <img
        class="team-logo"
        src=""
        alt="">

    </div>

</div>


    <!-- ROSTER -->

    <div class="roster-wrapper">

        <div class="roster roster-left">

            <div class="player-left">
                <span></span>
                <img src="">
            </div>

            <div class="player-left">
                <span></span>
                <img src="">
            </div>

            <div class="player-left">
                <span></span>
                <img src="">
            </div>

            <div class="player-left">
                <span></span>
                <img src="">
            </div>

        </div>


        <div class="roster-vs">
            VS
        </div>


        <div class="roster roster-right">

            <div class="player-right">
                <img src="">
                <span></span>
            </div>

            <div class="player-right">
                <img src="">
                <span></span>
            </div>

            <div class="player-right">
                <img src="">
                <span></span>
            </div>

            <div class="player-right">
                <img src="">
                <span></span>
            </div>

        </div>

    </div>

</div>

</header>


<!-- ==========================
     KPI CARDS
=========================== -->

<section class="stats-grid">

    <!-- Kampagnensiege -->

    <div class="stat-card">

        <img
            src="../0allgemein/KPI_Hintergründe/trophäe-hintergrund_kampagnensiege.png"
            class="stat-bg-icon"
            alt="">

        <div class="stat-title">
            Kampagnensiege
        </div>

        <div class="stat-score">

            <span
                class="eagles-color"
                id="campaignWinsEagles">
                0
            </span>

            <span>:</span>

            <span
                class="chicks-color"
                id="campaignWinsChicks">
                0
            </span>

        </div>

        <div
            class="stat-subtitle"
            id="campaignSubtitle">
        </div>

        <div class="battle-bar">

            <div
                class="battle-left"
                id="campaignBarEagles"
                style="width:50%">
            </div>

            <div
                class="battle-right"
                id="campaignBarChicks"
                style="width:50%">
            </div>

        </div>

        <div class="battle-footer">

            <span id="campaignPercentEagles">
                Team A 50%
            </span>

            <span id="campaignPercentChicks">
                Team B 50%
            </span>

        </div>

    </div>


    <!-- Kapitelsiege -->

    <div class="stat-card">

        <img
            src="../0allgemein/KPI_Hintergründe/flagge-hintergrund_Kapitelsiege.png"
            class="stat-bg-icon"
            alt="">

        <div class="stat-title">
            Kapitelsiege
        </div>

        <div class="stat-score">

            <span
                class="eagles-color"
                id="chapterWinsEagles">
                0
            </span>

            <span>:</span>

            <span
                class="chicks-color"
                id="chapterWinsChicks">
                0
            </span>

        </div>

        <div
            class="stat-subtitle"
            id="chapterSubtitle">
        </div>

        <div class="battle-bar">

            <div
                class="battle-left"
                id="chapterBarEagles"
                style="width:50%">
            </div>

            <div
                class="battle-right"
                id="chapterBarChicks"
                style="width:50%">
            </div>

        </div>

        <div class="battle-footer">

            <span id="chapterPercentEagles">
                Team A 50%
            </span>

            <span id="chapterPercentChicks">
                Team B 50%
            </span>

        </div>

    </div>


    <!-- Punktedifferenz -->

    <div class="stat-card">

        <img
            src="../0allgemein/KPI_Hintergründe/schalwaage_hintergrund_punktedifferenz.png"
            class="stat-bg-icon"
            alt="">

        <div class="stat-title">
            Punktedifferenz
        </div>

        <div
            class="difference-value"
            id="pointDifference">
            0
        </div>

        <div
            class="difference-text"
            id="differenceLeader">
            -
        </div>

        <div
            class="difference-percent"
            id="differencePercent">
            0%
        </div>

        <div class="difference-subtitle">
            Vorsprung auf Gesamtpunkte
        </div>

    </div>

</section>


<!-- ==========================
     VERGLEICHSCHART
=========================== -->

<section class="chart-panel">
    <h2>
        Gesamtpunkte im Vergleich
    </h2>
    <div class="chart-wrapper">
        <canvas id="punkteChart"></canvas>
    </div>
</section>


<!-- ==========================
     KAMPAGNENLISTE
=========================== -->

<section class="campaign-section">

    <h2>Kampagnenübersicht</h2>

    <div id="campaignContainer"></div>

</section>


<!-- ==========================
     FOOTER
=========================== -->

<footer>

    <span id="lastUpdate">
        Letztes Update
    </span>

</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="7event_youtube.js"></script>
<script src="7springfever2026_punktescript.js"></script>

</body>

</html>
